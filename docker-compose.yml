services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adrian
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: db_curso
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrian -d db_curso"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-curso:
    build: ./ms-curso
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  ms-estudiante:
    build: ./ms-estudiante
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  ms-matricula:
    build: ./ms-matricula
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
